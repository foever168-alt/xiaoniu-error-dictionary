<style>body{margin:0;font:24px sans-serif;color:#17324d;background:#f8fbfc}header{padding:16px;background:white;border-bottom:3px solid #17324d;display:flex;justify-content:space-between}.v{display:none}.on{display:block}main{max-width:1500px;margin:auto;padding:3vw}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:4px solid #17324d;border-radius:18px;padding:20px;min-height:280px;display:flex;flex-direction:column;justify-content:space-between}.card:nth-child(1){background:#e3f2ff}.card:nth-child(2){background:#e7f7ed}.card:nth-child(3){background:#fff1d8}button{font:inherit;padding:7px 14px;border:3px solid #17324d;background:#fff;border-radius:12px;box-shadow:3px 3px #17324d}</style>
<body><header><b onclick="go('home')">小妞的<span style="color:#e77b35">錯字典</span></b><span><button onclick="go('index')">單元索引</button> <button onclick="full()">全螢幕</button></span></header><main><section id="home" class="v on"><h1 style="font-size:8rem">小妞的<span style="color:#e77b35">錯字典</span></h1><p>從字形、字義到句法，把容易混淆的字變成課堂遊戲。</p><button onclick="go('index')">進入單元索引</button></section><section id="index" class="v"><h1>單元索引</h1><div class="grid"><article class="card"><h2>PAGE 02｜躁、燥</h2><p>形符辨義、語義引申、口訣、字族與拖拉闖關。</p><button onclick="go('zz')">開始單元</button></article><article class="card"><h2>PAGE 03｜的、得、地</h2><p>句法教學、基礎闖關、三字連擊與雙語延伸。</p><button onclick="go('de')">開始單元</button></article><article class="card"><h2>PAGE 04+｜持續擴充</h2><p>新增 HTML 後複製索引卡與單元區塊。</p><button onclick="go('add')">查看格式</button></article></div></section>
<section id="zz" class="v"><h1>PAGE 02｜躁、燥</h1><button onclick="go('index')">回索引</button><iframe src="躁燥辨字.html" style="width:100%;height:80vh;border:0"></iframe></section><section id="de" class="v"><h1>PAGE 03｜的、得、地</h1><button onclick="go('index')">回索引</button><iframe src="的得地互動教學.html" style="width:100%;height:80vh;border:0"></iframe></section><section id="add" class="v"><h1>持續擴充指南</h1><p>將新互動 HTML 放在同一資料夾，再複製索引卡與 iframe 區塊；原始教材不會被覆寫。</p></section></main><script>function go(id){document.querySelectorAll('.v').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');scrollTo(0,0)}function full(){document.documentElement.requestFullscreen()}</script></body></html>
