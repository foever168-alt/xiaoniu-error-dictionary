<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>的・地・得｜句法微課堂</title><style>
*{box-sizing:border-box}body{margin:0;background:#e7edf4;color:#182438;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;overflow:hidden}button{font:inherit;cursor:pointer;color:inherit}#stage{width:1600px;height:900px;background:white;position:absolute;left:50%;top:50%;transform-origin:center;display:flex;flex-direction:column;padding:36px 48px;overflow:hidden;font-size:32px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #182438;padding-bottom:13px;font-weight:800}header button,footer button,.smallbtn{border:2px solid #182438;background:white;border-radius:12px;padding:8px 17px;font-size:32px}main{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px;padding:24px 0}h1{font-size:52px;margin:0;line-height:1.15}h2{font-size:39px;margin:0}p{margin:0;line-height:1.45}footer{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:2px solid #d6dde5;padding-top:12px}nav{display:flex;gap:8px}nav button{padding:8px 14px;border:0;background:#edf1f5;font-size:32px}nav button.active{background:#182438;color:white}button:disabled{opacity:.35;cursor:default}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;flex:1}.panel{border:2px solid var(--c);background:var(--bg);border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}.de{--c:#235da5;--bg:#e8f1fc}.di{--c:#23744d;--bg:#e5f4eb}.dei{--c:#b35519;--bg:#fff0e1}.char{font-size:130px;font-weight:900;color:var(--c);line-height:1}.mark{color:var(--c);font-weight:900}.note{background:#f1f4f8;border-left:8px solid #182438;padding:15px 22px;border-radius:8px}.syntax{display:grid;grid-template-columns:1fr 150px 1fr 1.2fr;gap:20px;align-items:center;background:var(--bg);border-radius:16px;padding:12px 25px;flex:1;text-align:center}.syntax .middle{font-size:52px;color:var(--c);font-weight:900}.syntax strong{font-size:46px}.syntax .arrow{font-size:36px;color:var(--c);font-weight:bold}.rows{display:flex;flex-direction:column;gap:12px;flex:1}.triplet{display:grid;grid-template-columns:200px repeat(3,1fr);gap:12px;align-items:center;flex:1}.triplet div{padding:15px;border-radius:12px;background:var(--bg,#f1f4f8);font-weight:700;text-align:center}.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;flex:1}.hero{font-size:60px;font-weight:900}.gamehead{display:flex;justify-content:space-between;align-items:center}.progress{height:16px;background:#e5e9ee;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:#23744d;transition:width .2s}.sentence{flex:1;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;align-content:center;gap:8px;font-size:52px;font-weight:700;text-align:center;background:#f5f7fa;border-radius:20px;padding:24px;line-height:1.65}.slot{display:inline-flex;width:86px;height:88px;align-items:center;justify-content:center;border:3px dashed #8290a1;border-radius:12px;background:white;font-size:52px;vertical-align:middle;cursor:pointer}.slot.ok{border:3px solid #23744d;background:#e5f4eb;color:#23744d}.slot.no{border:3px solid #b63d3d;background:#ffecec;color:#a52c2c}.bank{display:flex;justify-content:center;gap:35px}.tile{width:126px;height:104px;border:3px solid var(--c);border-radius:15px;background:var(--bg);color:var(--c);font-size:62px;font-weight:900;touch-action:none;user-select:none;cursor:grab}.tile.sel{outline:5px solid #182438;outline-offset:5px}.feedback{min-height:88px;padding:12px 22px;background:#eef2f6;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:20px}.feedback p{flex:1}.ghost{position:fixed;z-index:1000;pointer-events:none;transform:translate(-50%,-50%);width:90px;height:80px;display:grid;place-items:center;background:white;border:3px solid #182438;border-radius:12px;font-size:52px;font-weight:900;box-shadow:0 8px 20px #0003}.table{display:grid;grid-template-columns:1fr 1.5fr 1.5fr;gap:3px;background:#dbe2eb;border:3px solid #dbe2eb;border-radius:12px;overflow:hidden}.table div{background:white;padding:18px}.table .th{background:#182438;color:white;font-weight:800}.center{text-align:center}.summary{display:flex;flex:1;flex-direction:column;justify-content:center;align-items:center;gap:28px}.score{font-size:108px;color:#23744d;font-weight:900}.key{font-size:32px;color:#40516a}button:focus-visible,.slot:focus-visible{outline:5px solid #8458d0;outline-offset:3px}@media print{body{overflow:visible}#stage{position:static;transform:none!important}}
</style></head><body><div id="stage"><header><span>國文微課堂｜漢語句法辨析</span><button id="full">⛶ 全螢幕</button></header><main id="main"></main><footer><button id="prev">← 上一頁</button><nav id="nav"></nav><button id="next">下一頁 →</button></footer></div><script>
const names=['三字辨析','句法圖解','同詞異構','地與得','記憶口訣','基礎闖關','進階闖關','雙語延伸'];let page=0;const main=document.querySelector('#main');const cls={'的':'de','地':'di','得':'dei'};const basic=[['她輕輕','推開窗戶。','地','「輕輕」是修飾「推開」的狀語。'],['窗外盛開著美麗','花朵。','的','「美麗」是修飾「花朵」的定語。'],['她高興','跳了起來。','得','「跳了起來」補充高興所引發的結果。'],['他若無其事','走進教室。','地','「若無其事」修飾走進教室的方式。'],['她是個心思細膩','女孩。','的','「心思細膩」修飾名詞「女孩」。'],['他將故事說','栩栩如生。','得','「栩栩如生」補充說故事的情狀。'],['他氣','一句話也說不出來。','得','補充生氣所引發的結果。'],['她一字一句','讀著那封信。','地','「一字一句」修飾閱讀的方式。'],['那是令人難以忘懷','風景。','的','「令人難以忘懷」修飾名詞「風景」。']].map(q=>({parts:q.slice(0,2),ans:[q[2]],why:q[3]}));const adv=[{parts:['美麗','女孩，專注','彈著鋼琴，彈','十分動聽。'],ans:['的','地','得'],why:'美麗修飾女孩；專注修飾彈琴；十分動聽補充彈奏的情狀。'},{parts:['他氣','滿臉通紅，憤怒','撕毀手中','信件。'],ans:['得','地','的'],why:'滿臉通紅補充氣的結果；憤怒修飾撕毀；手中修飾信件。'},{parts:['窗外','雨，淅淅瀝瀝','下著，整條街安靜','彷彿失去了聲音。'],ans:['的','地','得'],why:'窗外修飾雨；淅淅瀝瀝修飾下著；彷彿失去了聲音補充安靜的程度。'}];
const fresh=()=>({idx:0,values:{},wrong:{},selected:'',done:false,first:0});let states={5:fresh(),6:fresh()};const head=t=>`<h1>${t}</h1>`;function render(){document.querySelector('#nav').innerHTML=names.map((n,i)=>`<button class="${i===page?'active':''}" onclick="go(${i})">${n}</button>`).join('');document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=page===7;
if(page===0)main.innerHTML=head('同音不同功能：三個「ㄉㄜ˙」')+`<div class="grid"><div class="panel de"><div class="char">的</div><h2>定語標記</h2><p>修飾人物或事物</p><p>美麗<span class="mark">的</span>花朵<br>安靜<span class="mark">的</span>女孩</p><strong>什麼樣的事物？</strong></div><div class="panel di"><div class="char">地</div><h2>狀語標記</h2><p>修飾動作或狀態</p><p>安靜<span class="mark">地</span>閱讀<br>緩慢<span class="mark">地</span>行走</p><strong>怎麼做？</strong></div><div class="panel dei"><div class="char">得</div><h2>補語標記</h2><p>補充動作或狀態</p><p>跑<span class="mark">得</span>很快<br>累<span class="mark">得</span>發抖</p><strong>做得如何？</strong></div></div><p class="note">先找句子的中心語，再判斷它與前後成分的關係。</p>`;
if(page===1)main.innerHTML=head('用箭頭看懂三種句法關係')+`<div class="rows">${[['de','定語','美麗','的','花朵','名詞中心語','→ 修飾事物','定中關係'],['di','狀語','安靜','地','閱讀','動詞中心語','→ 修飾動作','狀中關係'],['dei','動詞中心語','跑','得','很快','補語','← 補充情狀','述補關係']].map(r=>`<div class="syntax ${r[0]}"><div>${r[1]}<br><strong>${r[2]}</strong></div><div class="middle">${r[3]}</div><div>${r[5]}<br><strong>${r[4]}</strong></div><div class="arrow">${r[6]}<br>${r[7]}</div></div>`).join('')}</div><p class="note">定語＋的＋名詞；狀語＋地＋動詞；動詞／形容詞＋得＋補語。這是常見用法，並非所有用法。</p>`;
if(page===2)main.innerHTML=head('同詞異構：詞語不變，功能改變')+`<div class="rows"><div class="triplet"><div>核心詞</div><div class="de">定語｜的</div><div class="di">狀語｜地</div><div class="dei">補語｜得</div></div>${[['認真','認真的學生','認真地學習','學習得很認真'],['安靜','安靜的女孩','安靜地閱讀','安靜得可怕'],['溫柔','溫柔的母親','溫柔地說話','說話說得很溫柔'],['快樂','快樂的孩子','快樂地歌唱','快樂得手舞足蹈']].map(r=>`<div class="triplet">${r.map((x,i)=>`<div class="${['','de','di','dei'][i]}">${x}</div>`).join('')}</div>`).join('')}</div><p class="note">決定用字的不是「認真」本身，而是它在句子中承擔的語法功能。</p>`;
if(page===3)main.innerHTML=head('「地」與「得」：觀察角度不同')+`<div class="two"><div class="panel di"><div class="hero mark">認真地寫</div><h2>狀語：動作方式</h2><svg width="180" height="120" viewBox="0 0 180 120" aria-label="書寫動作"><g fill="none" stroke="#23744d" stroke-width="5" stroke-linecap="round"><circle cx="55" cy="25" r="15"/><path d="M55 43L65 80 90 98M60 50L100 65 125 52M65 80L40 103M20 105H155M120 60L139 32"/></g></svg><p>他以什麼方式寫？<br>以認真的態度寫。</p></div><div class="panel dei"><div class="hero mark">寫得很認真</div><h2>補語：動作情狀</h2><svg width="180" height="120" viewBox="0 0 180 120"><g fill="none" stroke="#b35519" stroke-width="4"><rect x="45" y="8" width="86" height="101" rx="5"/><path d="M58 28H115M58 45H115M58 62H115M58 79H115"/><circle cx="131" cy="89" r="23" fill="#fff0e1"/><path d="M119 89L128 98 145 79"/></g></svg><p>他寫得如何？<br>寫的情狀很認真。</p></div></div><p>「得」還可引出程度或結果：高興得不得了、笑得流出眼淚、累得站不起來。</p><p class="note">前後位置是句法差異，不代表動作發生的時間先後。</p>`;
if(page===4)main.innerHTML=head('一句話，記住三種句法')+`<div class="summary"><div class="hero de mark">描述事物，用「的」。</div><div class="hero di mark">修飾動作，用「地」。</div><div class="hero dei mark">補充情狀，用「得」。</div><div class="note center" style="font-size:48px">可愛<span class="de mark">的</span>女孩，愉快<span class="di mark">地</span>歌唱，唱<span class="dei mark">得</span>十分動聽。</div></div>`;
if(page===5||page===6)game();if(page===7)main.innerHTML=head('雙語延伸：從助詞看句法')+`<div class="table"><div class="th">中文句法</div><div class="th">英文近似概念</div><div class="th">例句</div><div>定語</div><div>Attributive modifier</div><div>a beautiful girl</div><div>狀語</div><div>Adverbial modifier</div><div>read quietly</div><div>補語</div><div>Complement</div><div>laugh oneself sick</div></div><p class="note">中英文句法並非一對一對應，尤其漢語補語與英語 complement 的範疇不完全相同。</p><div class="summary"><h2>形近字：從字形推導字義</h2><h2>同音助詞：從句法判斷用字</h2></div>`;}
function go(i){page=Math.max(0,Math.min(7,i));render()}function game(){const s=states[page],qs=page===5?basic:adv,total=qs.reduce((n,q)=>n+q.ans.length,0),correct=qs.reduce((n,q,i)=>n+q.ans.filter((a,j)=>s.values[i+'-'+j]===a).length,0);if(s.done){main.innerHTML=head('闖關完成！')+`<div class="summary"><div class="score">${s.first}／${total}</div><h2>首次答對字數｜全部 ${total} 格已完成</h2><p>你已經能用句法辨認「的、地、得」。</p><button class="smallbtn" onclick="resetGame()">重新挑戰</button>${page===5?'<button class="smallbtn" onclick="go(6)">進階闖關 →</button>':''}</div>`;return}const q=qs[s.idx],done=q.ans.every((a,j)=>s.values[s.idx+'-'+j]===a),hasWrong=q.ans.some((a,j)=>s.values[s.idx+'-'+j]&&s.values[s.idx+'-'+j]!==a);main.innerHTML=`<div class="gamehead">${head(page===5?'字卡歸位｜基礎闖關':'三字連擊｜進階闖關')}<button class="smallbtn" onclick="resetGame()">重玩</button></div><div class="gamehead"><strong>第 ${s.idx+1}／${qs.length} 題</strong><strong>正確 ${correct}／${total} 格</strong></div><div class="progress"><i style="width:${correct/total*100}%"></i></div><div class="sentence">${q.parts.map((p,j)=>`${p}${j<q.ans.length?`<button aria-label="第${j+1}個空格" class="slot ${s.values[s.idx+'-'+j]?s.values[s.idx+'-'+j]===q.ans[j]?'ok':'no':''}" data-slot="${j}" onclick="place(${j})">${s.values[s.idx+'-'+j]||'？'}</button>`:''}`).join('')}</div><div class="bank">${['的','得','地'].map(c=>`<button class="tile ${cls[c]} ${s.selected===c?'sel':''}" data-char="${c}" aria-label="選擇${c}">${c}</button>`).join('')}</div><div class="feedback" aria-live="polite"><p>${done?'✓ 完全正確！'+q.why:hasWrong?'再想想：是在修飾事物、修飾動作，還是補充情狀？':s.selected?'已選「'+s.selected+'」，請點選空格。':'拖曳字卡到空格，或先點字卡、再點空格。'}</p><button class="smallbtn" ${done?'':'disabled'} onclick="advance()">${s.idx===qs.length-1?'看成績':'下一題'} →</button></div>`;bindTiles()}
function place(j,c){const s=states[page],q=(page===5?basic:adv)[s.idx],key=s.idx+'-'+j;c=c||s.selected;if(!c||s.values[key]===q.ans[j])return;if(c===q.ans[j]&&!s.wrong[key])s.first++;if(c!==q.ans[j])s.wrong[key]=true;s.values[key]=c;s.selected='';game()}
function advance(){const s=states[page],qs=page===5?basic:adv;if(!qs[s.idx].ans.every((a,j)=>s.values[s.idx+'-'+j]===a))return;if(s.idx===qs.length-1)s.done=true;else s.idx++;s.selected='';game()}function resetGame(){states[page]=fresh();game()}
function bindTiles(){document.querySelectorAll('.tile').forEach(el=>{let start=null,g=null;el.addEventListener('pointerdown',e=>{if(e.button!==0)return;start=[e.clientX,e.clientY];el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!start)return;if(!g&&Math.hypot(e.clientX-start[0],e.clientY-start[1])>7){g=document.createElement('div');g.className='ghost';g.textContent=el.dataset.char;document.body.append(g)}if(g){g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'}});el.addEventListener('pointerup',e=>{if(!start)return;const c=el.dataset.char;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-slot]');if(g){g.remove();g=null}start=null;if(target)place(Number(target.dataset.slot),c);else{states[page].selected=c;game()}});el.addEventListener('pointercancel',()=>{start=null;if(g)g.remove();g=null});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();states[page].selected=el.dataset.char;game();document.querySelector('.slot')?.focus()}})})}
function resize(){document.querySelector('#stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1600,innerHeight/900)})`}window.addEventListener('resize',resize);document.querySelector('#prev').onclick=()=>go(page-1);document.querySelector('#next').onclick=()=>go(page+1);document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(page+1);if(e.key==='ArrowLeft')go(page-1)});resize();render();</script></body></html>
